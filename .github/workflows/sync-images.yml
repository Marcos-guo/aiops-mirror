name: Sync Images to GHCR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'   # 每周日凌晨 2 点自动同步一次

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync all images
        run: |
          set +e
          SUCCESS=0
          FAILED=0
          
          while IFS='|' read -r SRC DST; do
            # 去掉注释和空行
            [[ -z "$SRC" || "$SRC" =~ ^[[:space:]]*# ]] && continue
            
            SRC_TRIMMED=$(echo "$SRC" | xargs)
            DST_TRIMMED=$(echo "$DST" | xargs)
            
            # 目标名统一小写
            TARGET="ghcr.io/${{ github.repository_owner }}/$DST_TRIMMED"
            TARGET=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
            
            echo "===================================================="
            echo "同步: $SRC_TRIMMED"
            echo "  → $TARGET"
            echo "===================================================="
            
            if docker pull "$SRC_TRIMMED"; then
              docker tag "$SRC_TRIMMED" "$TARGET"
              if docker push "$TARGET"; then
                echo "✅ 成功: $TARGET"
                SUCCESS=$((SUCCESS+1))
              else
                echo "❌ 推送失败: $TARGET"
                FAILED=$((FAILED+1))
              fi
            else
              echo "❌ 源拉取失败: $SRC_TRIMMED"
              FAILED=$((FAILED+1))
            fi
            echo
          done < images.txt
          
          echo "===================================================="
          echo "总结: 成功 $SUCCESS 个，失败 $FAILED 个"
          echo "===================================================="
